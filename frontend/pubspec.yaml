name: gamelearn_app
description: GameLearn AI - Smart Adaptive Learning Adventure client.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.0
  go_router: ^16.2.1
  http: ^1.5.0
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.3
  audioplayers: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
  fonts:
    - family: GameLearnDisplay
      fonts:
        - asset: assets/fonts/SpaceGrotesk-VF.ttf
    - family: GameLearnBody
      fonts:
        - asset: assets/fonts/Inter-VF.ttf
