spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/gamelearn}
    username: ${DB_USERNAME:gamelearn}
    password: ${DB_PASSWORD:}
  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug

gamelearn:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:[*]}
