spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: gamelearn-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      # Backstop ABOVE the application max-bytes limit (5 MiB): the
      # application validation triggers first with field-level errors;
      # this only stops abuse that bypasses it (mapped to 413).
      max-file-size: 6MB
      max-request-size: 6MB
  jpa:
    # Schema ownership belongs to Flyway; Hibernate must never create or
    # alter tables silently.
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        # Database Specification section 3: UUIDs are stored as CHAR(36),
        # not BINARY(16) or a dialect-specific type. (hibernate.type.uuid_char
        # was removed in Hibernate 6; this is its replacement.)
        type.preferred_uuid_jdbc_type: char
        # Database Specification section 4: all timestamps handled as UTC.
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId:-none}] %logger{36} - %msg%n"
  level:
    root: info
    com.gamelearn: info

gamelearn:
  security:
    jwt:
      # Signing secret MUST be injected from the environment (JWT_SECRET).
      # Startup fails fast when it is missing or shorter than 32 characters.
      secret: ${JWT_SECRET:}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
      issuer: gamelearn
  ai:
    gemini:
      # Secrets come ONLY from the environment; never committed values.
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
      connect-timeout: 3s
      read-timeout: 15s
    learning-path:
      # PATH-002 feature flag (Learning Path AI Specification section 20):
      # false routes generation straight to the deterministic SYSTEM path.
      enabled: true
      temperature: 0.3
      max-output-tokens: 2048
      deadline: 20s
      retry:
        max-retries: 1          # approved policy: exactly one automatic retry
        backoff-base: 2s        # exponential with +/-25% jitter
      rate-limit:
        max-requests-per-hour: 10   # D10 - Gemini-backed calls only
        window-minutes: 60
    tutor:
      # AI-001 (AI-TUTOR v1.0.0 APPROVED; API Contract v1.4.0 section 5D).
      # Dedicated bucket and parameters - never shared with PATH-002.
      enabled: true
      temperature: 0.4
      max-output-tokens: 1024
      deadline: 15s
      retry:
        max-retries: 1          # approved policy: exactly one automatic retry
        backoff-base: 2s        # exponential with +/-25% jitter
      rate-limit:
        max-requests-per-hour: 20   # OT-4 - dedicated tutor bucket
        window-minutes: 60
    rag:
      # Gate 23: RAG evidence sidecar for AI Tutor grounding.
      # Disabled by default: AI-001 keeps its exact legacy behavior.
      # Token comes ONLY from the environment (RAG_SIDECAR_TOKEN).
      enabled: false
      base-url: ${RAG_SIDECAR_BASE_URL:http://127.0.0.1:8431}
      service-token: ${RAG_SIDECAR_TOKEN:}
      connect-timeout: 1s
      read-timeout: 5s
      top-k: 5
      evidence-budget-chars: 4000
    documents:
      # USER-DOC RAG Phase C: local PDF upload/ingestion. Storage root
      # defaults to ~/.gamelearn/documents (outside the repository);
      # override per machine via GAMELEARN_DOCUMENTS_STORAGE_ROOT.
      # Size/page/text ceilings are enforced by the application BEFORE
      # expensive parsing (the sidecar carries matching backstops).
      storage-root: ${GAMELEARN_DOCUMENTS_STORAGE_ROOT:${user.home}/.gamelearn/documents}
      max-bytes: 5242880
      max-pages: 50
      max-chars-per-page: 20000
      max-total-chars: 200000
      connect-timeout: 1s
      extract-timeout: 30s
      # Phase F: localhost Qdrant for user-document vectors (Phase A
      # infrastructure). Localhost-only; timeouts reuse the budgets above.
      qdrant-base-url: ${QDRANT_BASE_URL:http://127.0.0.1:6333}
      # Phase G: owner-scoped retrieval. topK is bounded client input;
      # min-score is an UNCALIBRATED candidate filter (default off) —
      # candidate selection only, never grounding acceptance.
      retrieval-top-k-default: 5
      retrieval-top-k-max: 10
      retrieval-max-query-chars: 1000
      retrieval-min-score: 0.0
      retrieval-max-evidence: 20
      # Phase I: user-document Q&A (POST /api/v1/documents/ask). Disabled
      # by default; only this endpoint reads the flag.
      document-rag-enabled: ${GAMELEARN_AI_DOCUMENT_RAG_ENABLED:false}
      ask-max-question-chars: 1000
      ask-temperature: 0.3
      ask-max-output-tokens: 1024
      ask-deadline: 20s
      ask-rate-limit:
        max-asks-per-hour: 20
        window-minutes: 60
      rate-limit:
        max-uploads-per-hour: 10
        window-minutes: 60
  gamification:
    game-result-rate-limit:
      max-submissions-per-hour: 30
      window-minutes: 60
