<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0E7490" stop-opacity="0.04"/>
    </radialGradient>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="visor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16213A"/>
      <stop offset="100%" stop-color="#050A18"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A5F3FC"/>
      <stop offset="55%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="torso" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>
  <!-- Backdrop -->
  <circle cx="100" cy="100" r="92" fill="url(#bg)" stroke="#22D3EE" stroke-opacity="0.16" stroke-width="1.5"/>
  <!-- Antenna -->
  <rect x="98" y="18" width="4" height="16" rx="2" fill="#94A3B8"/>
  <circle cx="100" cy="16" r="9" fill="url(#coreGlow)" opacity="0.9"/>
  <circle cx="100" cy="16" r="4.5" fill="#22D3EE"/>
  <circle cx="100" cy="16" r="2" fill="#ECFEFF"/>
  <!-- Ear pods -->
  <rect x="52" y="72" width="12" height="26" rx="6" fill="url(#chrome)" stroke="#22D3EE" stroke-opacity="0.35" stroke-width="1"/>
  <rect x="136" y="72" width="12" height="26" rx="6" fill="url(#chrome)" stroke="#22D3EE" stroke-opacity="0.35" stroke-width="1"/>
  <circle cx="58" cy="85" r="3" fill="#22D3EE"/>
  <circle cx="142" cy="85" r="3" fill="#22D3EE"/>
  <!-- Neck + torso -->
  <rect x="88" y="128" width="24" height="12" rx="4" fill="#64748B"/>
  <path d="M62 168 Q62 140 100 140 Q138 140 138 168 L138 178 L62 178 Z" fill="url(#torso)"/>
  <rect x="62" y="140" width="76" height="5" fill="#0F172A" opacity="0.25"/>
  <!-- Chest core -->
  <circle cx="100" cy="160" r="13" fill="url(#coreGlow)" opacity="0.85"/>
  <circle cx="100" cy="160" r="6.5" fill="#0E7490" stroke="#22D3EE" stroke-width="1.5"/>
  <circle cx="100" cy="160" r="3" fill="#A5F3FC"/>
  <!-- Head dome -->
  <circle cx="100" cy="88" r="36" fill="url(#chrome)" stroke="#22D3EE" stroke-opacity="0.30" stroke-width="1.5"/>
  <path d="M68 78 Q72 52 100 50 Q128 52 132 78 Q112 66 100 66 Q88 66 68 78 Z" fill="#FFFFFF" opacity="0.55"/>
  <!-- Visor -->
  <rect x="66" y="72" width="68" height="34" rx="17" fill="url(#visor)" stroke="#22D3EE" stroke-opacity="0.45" stroke-width="1.2"/>
  <!-- Eyes (glowing) -->
  <ellipse cx="86" cy="89" rx="9" ry="10" fill="#22D3EE" opacity="0.30"/>
  <ellipse cx="114" cy="89" rx="9" ry="10" fill="#22D3EE" opacity="0.30"/>
  <path d="M79 89 Q86 80 93 89 Q86 96 79 89 Z" fill="#67E8F9"/>
  <path d="M107 89 Q114 80 121 89 Q114 96 107 89 Z" fill="#67E8F9"/>
  <circle cx="86" cy="87" r="2.2" fill="#FFFFFF"/>
  <circle cx="114" cy="87" r="2.2" fill="#FFFFFF"/>
  <!-- Mouth slit -->
  <rect x="93" y="112" width="14" height="2.6" rx="1.3" fill="#22D3EE" opacity="0.8"/>
  <!-- Rarity accent dot -->
  <circle cx="100" cy="190" r="3.5" fill="#22D3EE" opacity="0.9"/>
</svg>
